<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports | synTAX Accounting</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Global CSS -->
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      color: #333;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar h2 {
      font-weight: 600;
      margin-bottom: 20px;
      color: #1565c0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: 10px 14px;
      border-radius: 10px;
      margin: 4px 0;
      cursor: pointer;
      transition: all 0.3s;
    }

    .sidebar li:hover,
    .sidebar li.active {
      background: rgba(21, 101, 192, 0.15);
      color: #1565c0;
      font-weight: 500;
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 24px;
      color: #0d47a1;
    }

    /* Cards & Sections */
    .card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .card h3 {
      margin-bottom: 15px;
      color: #1565c0;
      border-bottom: 1px solid rgba(21, 101, 192, 0.2);
      padding-bottom: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: rgba(21, 101, 192, 0.1);
      color: #1565c0;
      font-weight: 600;
    }

    td {
      color: #333;
    }

    /* Charts */
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    canvas {
      width: 100% !important;
      max-height: 300px;
    }

    /* Buttons */
    .toolbar {
      margin-bottom: 15px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }

    button:hover {
      background: #0d47a1;
    }

  </style>
</head>

<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div>
        <h2>synTAX</h2>
        <ul>
          <li onclick="location.href='index.html'">🏠 Dashboard</li>
          <li onclick="location.href='journal.html'">📘 Journal</li>
          <li onclick="location.href='ledger.html'">📊 Ledger</li>
          <li class="active">📑 Reports</li>
          <li onclick="location.href='settings.html'">⚙️ Settings</li>
        </ul>
      </div>
      <div>
        <label style="font-size: 13px;">
          <input type="checkbox" id="themeSwitch" /> Dark Mode
        </label>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div class="header">
        <h1>Financial Reports</h1>
        <div class="toolbar">
          <button onclick="exportReports()">📤 Export Reports</button>
          <button onclick="window.print()">🖨️ Print</button>
        </div>
      </div>

      <!-- Trial Balance -->
      <div class="card">
        <h3>Trial Balance</h3>
        <table id="trialBalanceTable">
          <thead>
            <tr>
              <th>Account</th>
              <th>Debit</th>
              <th>Credit</th>
            </tr>
          </thead>
          <tbody>
            <!-- Auto-filled from app.js -->
          </tbody>
        </table>
      </div>

      <!-- Income Statement -->
      <div class="card">
        <h3>Income Statement</h3>
        <table id="incomeStatementTable">
          <thead>
            <tr>
              <th>Category</th>
              <th>Amount (₱)</th>
            </tr>
          </thead>
          <tbody>
            <!-- Auto-filled -->
          </tbody>
        </table>
      </div>

      <!-- Balance Sheet -->
      <div class="card">
        <h3>Balance Sheet</h3>
        <table id="balanceSheetTable">
          <thead>
            <tr>
              <th>Category</th>
              <th>Amount (₱)</th>
            </tr>
          </thead>
          <tbody>
            <!-- Auto-filled -->
          </tbody>
        </table>
      </div>

      <!-- Charts -->
      <div class="card">
        <h3>Visual Insights</h3>
        <div class="charts">
          <canvas id="incomeExpenseChart"></canvas>
          <canvas id="balanceChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // --- Chart Setup ---
    document.addEventListener("DOMContentLoaded", () => {
      loadReports(); // Call function from app.js

      // Income vs Expense Chart
      const ctx1 = document.getElementById('incomeExpenseChart');
      new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: ['Income', 'Expenses'],
          datasets: [{
            label: '₱ Amount',
            data: [localStorage.getItem('totalIncome') || 0, localStorage.getItem('totalExpenses') || 0],
            backgroundColor: ['#42a5f5', '#ef5350']
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });

      // Balance Sheet Chart
      const ctx2 = document.getElementById('balanceChart');
      new Chart(ctx2, {
        type: 'pie',
        data: {
          labels: ['Assets', 'Liabilities', 'Equity'],
          datasets: [{
            data: [120000, 60000, 60000],
            backgroundColor: ['#64b5f6', '#ffca28', '#81c784']
          }]
        },
        options: {
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    });

    // Export function
    function exportReports() {
      const data = {
        trialBalance: document.getElementById('trialBalanceTable').innerText,
        incomeStatement: document.getElementById('incomeStatementTable').innerText,
        balanceSheet: document.getElementById('balanceSheetTable').innerText
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'financial_reports.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
