<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | synTAX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar">
      <h2>synTAX</h2>
      <ul>
        <li onclick="navigate('index.html')">Dashboard</li>
        <li onclick="navigate('journal.html')">Journal</li>
        <li onclick="navigate('ledger.html')">Ledger</li>
        <li class="active">Reports</li>
        <li onclick="navigate('transactions.html')">Transactions</li>
      </ul>
    </div>

    <div class="content">
      <h1>Financial Reports</h1>
      <div class="toolbar">
        <button onclick="generateReports()">Generate All Reports</button>
      </div>

      <section id="trialBalanceSection" class="report-section">
        <h2>Trial Balance</h2>
        <div id="trialBalance"></div>
      </section>

      <section id="incomeStatementSection" class="report-section">
        <h2>Income Statement</h2>
        <div id="incomeStatement"></div>
      </section>

      <section id="balanceSheetSection" class="report-section">
        <h2>Balance Sheet</h2>
        <div id="balanceSheet"></div>
      </section>
    </div>
  </div>

<!-- Report Modal -->
<div id="reportModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h2>Generated Reports</h2>
    <div id="modalReports"></div>
  </div>
</div>


  <script src="app.js"></script>
</body>
</html>
